<style>
/* Layout: a bright lab site. The top menu switches between views; content sits in cards
   on a white ground; #00854A is the point colour only (buttons, links, marks, live states). */
:root {
  --bg: #FFFFFF;
  --band: #F3F6F4;
  --card: #FFFFFF;
  --ink: #101614;
  --ink-2: #46514C;
  --ink-3: #65716B;
  --line: #E0E6E2;
  --line-soft: #ECF0ED;
  --accent: #00854A;
  --accent-strong: #006B3C;
  --accent-soft: #E3F3EA;
  --accent-text: #00854A;
  --on-accent: #FFFFFF;
  --mark: #00854A;
  --mark-muted: #85928B;
  --grid: #E6EBE8;
  --banner: #101614;
  --banner-line: #2D3833;
  --on-banner: #FFFFFF;
  --on-banner-2: #B9C4BE;
  --warn: #8A5200;
  --warn-soft: #FBF0DC;
  --dot: rgba(16, 22, 20, .08);
  --shadow: 0 1px 2px rgba(16, 22, 20, .04), 0 12px 28px -16px rgba(16, 22, 20, .16);

  --font: "Inter", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --r: 16px;
  --r-sm: 10px;
  --header-h: 4rem;
  --gut: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1110; --band: #111715; --card: #161D1A;
    --ink: #EEF3F0; --ink-2: #B5C0BA; --ink-3: #8C9892;
    --line: #27312C; --line-soft: #1E2723;
    --accent: #00854A; --accent-strong: #00A15A; --accent-soft: #12281E; --accent-text: #45CE8F; --on-accent: #FFFFFF;
    --mark: #1FA868; --mark-muted: #6B7872; --grid: #222C27;
    --banner: #1A2420; --banner-line: #33403A; --on-banner: #FFFFFF; --on-banner-2: #AEB9B3;
    --warn: #E5A54B; --warn-soft: #2B2314;
    --dot: rgba(255, 255, 255, .06);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 28px -16px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1110; --band: #111715; --card: #161D1A;
  --ink: #EEF3F0; --ink-2: #B5C0BA; --ink-3: #8C9892;
  --line: #27312C; --line-soft: #1E2723;
  --accent: #00854A; --accent-strong: #00A15A; --accent-soft: #12281E; --accent-text: #45CE8F; --on-accent: #FFFFFF;
  --mark: #1FA868; --mark-muted: #6B7872; --grid: #222C27;
  --banner: #1A2420; --banner-line: #33403A; --on-banner: #FFFFFF; --on-banner-2: #AEB9B3;
  --warn: #E5A54B; --warn-soft: #2B2314;
  --dot: rgba(255, 255, 255, .06);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 28px -16px rgba(0, 0, 0, .7);
  color-scheme: dark;
}
@media (min-width: 720px) { :root { --gut: 28px; } }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 1rem;
  line-height: 1.7;
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
a { color: var(--accent-text); text-underline-offset: 3px; text-decoration-thickness: 1px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4, p, ol, ul, figure { margin: 0; }
ol, ul { padding: 0; list-style: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.wrap {
  width: 100%; max-width: 74rem; margin-inline: auto;
  padding-left: max(var(--gut), env(safe-area-inset-left, 0px));
  padding-right: max(var(--gut), env(safe-area-inset-right, 0px));
}
.skip { position: absolute; left: 16px; top: -4rem; z-index: 40; background: var(--ink); color: var(--bg); padding: .5rem .8rem; border-radius: 8px; text-decoration: none; }
.skip:focus { top: calc(env(safe-area-inset-top, 0px) + .5rem); }
#main { outline: none; }

/* ---------- header ---------- */
.site-header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.topbar { display: flex; flex-wrap: wrap; align-items: center; column-gap: 1.25rem; min-height: var(--header-h); }
.brand { display: inline-flex; align-items: center; gap: .6rem; margin-right: auto; color: var(--ink); text-decoration: none; }
.brand-mark { width: 2rem; height: 2rem; border-radius: 9px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; font-size: .9375rem; letter-spacing: -.02em; }
.brand b { font-weight: 800; font-size: 1.0625rem; letter-spacing: -.02em; }
.brand .alt { font-size: .8125rem; font-weight: 500; color: var(--ink-3); }
.nav { --nav-pad: .7rem; display: flex; align-self: stretch; gap: .125rem; }
.nav a { position: relative; display: flex; align-items: center; padding: 0 var(--nav-pad); font-size: .9375rem; font-weight: 500; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); font-weight: 700; }
.nav a[aria-current="page"]::after { content: ""; position: absolute; left: var(--nav-pad); right: var(--nav-pad); bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
.tools { display: flex; flex: none; align-items: center; gap: .5rem; }
.seg { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); }
.seg button { padding: .32rem .7rem; border: 0; border-radius: 999px; background: transparent; color: var(--ink-3); font-size: .8125rem; font-weight: 600; line-height: 1.2; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.icon-btn { width: 2.25rem; height: 2.25rem; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 50%; background: var(--card); color: var(--ink-2); cursor: pointer; }
.icon-btn:hover { color: var(--ink); border-color: var(--ink-3); }
/* one row on wide screens: the menu scrolls sideways rather than pushing the tools onto a second row */
@media (min-width: 1041px) {
  .topbar { flex-wrap: nowrap; }
  .brand { flex: none; }
  .nav { min-width: 0; overflow-x: auto; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  :lang(en) .nav { --nav-pad: .6rem; }
  :lang(en) .brand .alt { display: none; }
}
@media (max-width: 1040px) {
  :root { --header-h: 6.25rem; }
  .topbar { padding-top: .7rem; }
  .nav { order: 3; flex-basis: 100%; height: 2.75rem; margin-top: .25rem; margin-left: calc(-1 * var(--nav-pad)); overflow-x: auto; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 2rem), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 2rem), transparent); }
  .nav::-webkit-scrollbar { display: none; }
}
@media (max-width: 440px) { .brand .alt { display: none; } }
@media (max-width: 350px) { .topbar { column-gap: .5rem; } .seg button { padding-inline: .5rem; } }
@media (max-width: 540px) { :lang(en) .brand .alt { display: none; } }

/* ---------- shared pieces ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; padding: .7rem 1.15rem; border: 1px solid transparent; border-radius: var(--r-sm); font-size: .9375rem; font-weight: 700; line-height: 1.2; text-decoration: none; cursor: pointer; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-strong); }
.btn-ghost { background: var(--card); border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { border-color: var(--ink-3); }
.btn-sm { padding: .42rem .75rem; border-radius: 8px; font-size: .8125rem; font-weight: 600; }
.link-btn { padding: 0; border: 0; background: none; color: var(--accent-text); font-size: .9063rem; font-weight: 600; cursor: pointer; text-align: left; }
.link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: clamp(1.15rem, 2.5vw, 1.6rem); min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .25rem 1rem; margin-bottom: .6rem; }
.card-head h2, .card-head h3, .card > h2, .card > h3 { font-size: 1.125rem; font-weight: 800; letter-spacing: -.02em; }
.card > h2 { margin-bottom: .35rem; }
.more-link { font-size: .9063rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
.more-link:hover { text-decoration: underline; }
.tag { display: inline-flex; align-items: center; padding: .3rem .55rem; border-radius: 999px; background: var(--band); color: var(--ink-2); font-size: .75rem; font-weight: 600; line-height: 1; white-space: nowrap; }
.tag.on { background: var(--accent-soft); color: var(--accent-strong); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.line { background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.tag.idx { background: transparent; box-shadow: inset 0 0 0 1px var(--accent-text); color: var(--accent-text); font-weight: 700; letter-spacing: .02em; }
.tag.rank { background: var(--accent); color: var(--on-accent); font-weight: 700; letter-spacing: .01em; cursor: help; }
:root[data-theme="dark"] .tag.on { color: var(--accent-text); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.on { color: var(--accent-text); } }
.chips { display: flex; flex-wrap: wrap; gap: .4rem; }
.chip { padding: .22rem .65rem; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink-2); font-size: .8125rem; font-weight: 500; }
.ext { display: inline-flex; align-items: center; gap: .15rem; font-size: .8125rem; font-weight: 600; text-decoration: none; white-space: nowrap; }
.ext:hover { text-decoration: underline; }
.mail { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; }
.email-text { font-weight: 600; user-select: all; overflow-wrap: anywhere; }
.ticon { width: 2.75rem; height: 2.75rem; flex: none; display: grid; place-items: center; border-radius: 12px; background: var(--accent-soft); color: var(--accent-strong); }
:root[data-theme="dark"] .ticon { color: var(--accent-text); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ticon { color: var(--accent-text); } }
.ticon svg { width: 1.5rem; height: 1.5rem; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- home: hero ---------- */
.hero-band { background-color: var(--band); background-image: radial-gradient(var(--dot) 1px, transparent 1.5px); background-size: 22px 22px; border-bottom: 1px solid var(--line); }
.hero { display: grid; grid-template-columns: minmax(0, 46rem); gap: clamp(1.5rem, 4vw, 4rem); align-items: center; padding-block: clamp(2.5rem, 6vw, 4.5rem) clamp(5rem, 9vw, 6.5rem); }
.pill { display: inline-flex; align-items: center; gap: .5rem; padding: .38rem .85rem; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink-2); font-size: .875rem; font-weight: 600; line-height: 1.3; }
.pill i { width: .5rem; height: .5rem; flex: none; border-radius: 50%; background: var(--accent); }
.name { margin-top: 1.25rem; font-size: clamp(3rem, 2rem + 5vw, 5rem); font-weight: 800; line-height: 1.05; letter-spacing: -.04em; }
.lead { margin-top: 1.25rem; max-width: 21em; font-size: clamp(1.3rem, 1.05rem + 1.1vw, 1.875rem); font-weight: 700; line-height: 1.4; letter-spacing: -.025em; text-wrap: balance; }
.lead em { display: inline-block; font-style: normal; color: var(--accent-text); }
.lead-sub { margin-top: .9rem; max-width: 34em; color: var(--ink-2); }
.cta { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1.75rem; }
.hero .mail { margin-top: 1.1rem; font-size: .9375rem; }
.hero .mail .who { color: var(--ink-2); font-weight: 600; text-decoration: none; }
.hero .mail .who:hover { color: var(--ink); text-decoration: underline; }
.stage { position: relative; justify-self: center; width: min(100%, 30rem); }
.stage::before { content: ""; position: absolute; left: 6%; right: 6%; top: 3%; aspect-ratio: 1 / 1; border-radius: 50%; background: radial-gradient(closest-side, var(--accent-soft), transparent); pointer-events: none; }
.stage canvas { position: relative; display: block; width: 100%; aspect-ratio: 1 / 1; touch-action: pan-y; cursor: grab; }
.stage figcaption { position: relative; display: flex; flex-direction: column; align-items: center; gap: .4rem; margin-top: .35rem; }
.stage .pill { font-size: .8125rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stage .pill.quiet { color: var(--ink-3); font-weight: 500; }
/* one line each, so the caption keeps its height while the read-out changes */
.stage .pill { max-width: 100%; }
.stage .pill.quiet > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage canvas[hidden] { display: none; }
.scene-tabs { align-self: stretch; display: flex; flex-wrap: wrap; justify-content: center; gap: .3rem; margin-bottom: .25rem; }
.scene-tabs button { padding: .36rem .68rem; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink-2); font-size: .8125rem; font-weight: 600; line-height: 1.2; cursor: pointer; }
.scene-tabs button:hover { border-color: var(--ink-3); color: var(--ink); }
.scene-tabs button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
:lang(en) .scene-tabs button { padding-inline: .52rem; font-size: .75rem; }
/* when the stage is too narrow for four in a row, two by two */
.stage { container-type: inline-size; }
@container (max-width: 26rem) { .scene-tabs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); } :lang(en) .scene-tabs button { padding-inline: .68rem; font-size: .8125rem; } }
@media (max-width: 880px) {
  .hero { grid-template-columns: minmax(0, 1fr); padding-bottom: clamp(4.5rem, 12vw, 5.5rem); }
  .stage { width: min(100%, 24rem); }
}

/* ---------- home: stats and sections ---------- */
.stats { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; margin-top: -3rem; }
.stat { display: block; width: 100%; padding: 1.2rem 1.25rem 1.1rem; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); text-align: left; cursor: pointer; }
.stat:hover { border-color: var(--accent-text); }
.stat .v { display: block; font-size: clamp(1.9rem, 1.5rem + 1.4vw, 2.5rem); font-weight: 800; line-height: 1.1; letter-spacing: -.03em; }
.stat .v small { margin-left: .12em; font-size: .42em; font-weight: 700; letter-spacing: 0; color: var(--ink-2); }
.stat .k { display: block; margin-top: .35rem; font-size: .9375rem; font-weight: 700; }
.stat .s { display: block; margin-top: .1rem; font-size: .8125rem; line-height: 1.5; color: var(--ink-3); }
.home-sec { margin-top: clamp(3rem, 6vw, 4.5rem); }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.2rem; }
.sec-head h2 { font-size: clamp(1.4rem, 1.2rem + .8vw, 1.75rem); font-weight: 800; letter-spacing: -.03em; }
.topic-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; }
.tcard { display: flex; flex-direction: column; gap: .7rem; }
.tcard h3 { font-size: 1.0625rem; font-weight: 700; line-height: 1.4; letter-spacing: -.015em; }
.tcard p { font-size: .9063rem; line-height: 1.6; color: var(--ink-2); }
.tcard .link-btn { margin-top: auto; padding-top: .3rem; }
.topic-grid.with-fig { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tcard .rfig { max-width: 32rem; margin-top: .3rem; }
@media (max-width: 960px) { .topic-grid.with-fig { grid-template-columns: minmax(0, 1fr); } }
/* two equal columns with the same gap as the card grids above them, so card edges line up from row to row */
.cols-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; align-items: stretch; }
.banner + .cols-2 { margin-top: 1rem; }
.card.prose > h2 { margin-bottom: .75rem; }
.after { display: flex; flex-direction: column; gap: .85rem; }
.after > h2 { margin-bottom: 0; }
.after > p { margin-top: -.5rem; font-size: .9063rem; color: var(--ink-2); }
.after .more-link { margin-top: auto; padding-top: .25rem; align-self: flex-start; }
.mini > li { display: grid; grid-template-columns: 4.1rem minmax(0, 1fr); column-gap: .75rem; padding: .85rem 0; border-top: 1px solid var(--line-soft); }
.mini > li:first-child { border-top: 0; }
.mini .d { padding-top: .1rem; font-size: .8125rem; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.mini h3, .plain h3 { font-size: .9375rem; font-weight: 600; line-height: 1.5; }
.mini .m, .plain .m { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .5rem; margin-top: .3rem; font-size: .8125rem; color: var(--ink-3); }
.plain > li { display: block; padding: .9rem 0; border-top: 1px solid var(--line-soft); }
.plain > li:first-child { border-top: 0; }
.meter { height: 6px; margin-top: .6rem; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; background: var(--mark); }
.meter-label { display: flex; justify-content: space-between; gap: 1rem; margin-top: .3rem; font-size: .75rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.banner { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1.5rem 2.5rem; align-items: center; padding: clamp(1.6rem, 4vw, 2.75rem); border-radius: 20px; background: var(--banner); color: var(--on-banner); }
.banner h2 { font-size: clamp(1.4rem, 1.2rem + .9vw, 1.9rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.3; }
.banner p { margin-top: .6rem; max-width: 44em; color: var(--on-banner-2); }
.banner .actions { display: grid; gap: .65rem; justify-items: start; }
.banner .email-text { color: var(--on-banner); }
.banner .btn-ghost { background: transparent; border-color: var(--banner-line); color: var(--on-banner); }
.banner .btn-ghost:hover { border-color: var(--on-banner-2); }
.home-end { padding-bottom: clamp(3rem, 6vw, 5rem); }
@media (max-width: 960px) {
  .topic-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols-2 { grid-template-columns: minmax(0, 1fr); }
  .banner { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 720px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; } }
@media (max-width: 560px) { .topic-grid { grid-template-columns: minmax(0, 1fr); } }

/* ---------- inner views ---------- */
.view-band { background-color: var(--band); background-image: radial-gradient(var(--dot) 1px, transparent 1.5px); background-size: 22px 22px; border-bottom: 1px solid var(--line); }
.view-head { padding-block: clamp(2.25rem, 5vw, 3.25rem); }

/* ---------- projects ---------- */
.pj { --track: 22rem; }

.person i { width: 2.5rem; height: 2.5rem; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--band); color: var(--ink-2); font-style: normal; font-size: .9375rem; font-weight: 700; }

oul National University of Science and Technology in 2018, worked as a Senior Researcher at the Deutsche Telekom Chair of Communication Networks at TU Dresden, and served on the faculty of Hannam University before joining Kongju National University in September 2025.","His research began with broadcast–broadband hybrid 3DTV and 360° VR video delivery and now extends to point cloud streaming and haptic media."]},"education":[{"date":"2018.08","degree":{"ko":"박사","en":"Ph.D."},"field":"Information Technology and Media Engineering","org":{"ko":"서울과학기술대학교","en":"Seoul National University of Science and Technology"}},{"date":"2014.02","degree":{"ko":"석사","en":"M.S."},"field":"Media IT Engineering","org":{"ko":"서울과학기술대학교","en":"Seoul National University of Science and Technology"}},{"date":"2012.02","degree":{"ko":"학사","en":"B.S."},"field":"Media Engineering","org":{"ko":"서울과학기술대학교","en":"Seoul National University of Science and Technology"}}],"experience":[{"from":"2025.09","to":null,"role":{"ko":"부교수","en":"Associate Professor"},"org":{"ko":"국립공주대학교 컴퓨터교육과","en":"Department of Computer Education, Kongju National University"}},{"from":"2025.03","to":"2025.08","role":{"ko":"부교수","en":"Associate Professor"},"org":{"ko":"한남대학교 정보통신공학과","en":"Department of Information and Communication Engineering, Hannam University"}},{"from":"2021.03","to":"2025.02","role":{"ko":"조교수","en":"Assistant Professor"},"org":{"ko":"한남대학교 정보통신공학과","en":"Department of Information and Communication Engineering, Hannam University"}},{"from":"2018.09","to":"2021.02","role":{"ko":"선임연구원","en":"Senior Researcher"},"org":{"ko":"드레스덴 공과대학교(TU Dresden) Deutsche Telekom Chair of Communication Networks","en":"Deutsche Telekom Chair of Communication Networks, Technische Universität Dresden"}},{"from":"2014.04","to":"2014.07","role":{"ko":"연구원","en":"Researcher"},"org":{"ko":"KETI IoT Platform Research Center","en":"IoT Platform Research Center, Korea Electronics Technology Institute (KETI)"}},{"from":"2012.03 const saved = store.get('site.lang');
const state = {
  lang: saved === 'ko' || saved === 'en' ? saved : ((navigator.language || 'ko').toLowerCase().startsWith('ko') ? 'ko' : 'en'),
  type: 'all', year: null, topic: null, q: ''
};
const t = (k, vars) => {
  let s = T[state.lang][k];
  if (s == null) s = T.ko[k];
  if (s == null) return k;
  if (vars) for (const [a, b] of Object.entries(vars)) s = s.split('{' + a + '}').join(b);
  return s;
};
const L = o => (o && typeof o === 'object') ? (o[state.lang] ?? o.ko ?? o.en ?? '') : (o ?? '');
const num = n => n.toLocaleString('en-US');
const ext = (url, label, cls) => h('a', { class: cls || 'ext', href: url, target: '_blank', rel: 'noopener noreferrer' }, label, h('span', { 'aria-hidden': 'true' }, ' ↗'));
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const ym = iso => state.lang === 'ko' ? iso.slice(0, 4) + '.' + iso.slice(5, 7) : MON[+iso.slice(5, 7) - 1] + ' ' + iso.slice(0, 4);
const dot = iso => iso.replace(/-/g, '.');
const now = new Date();
const todayIso = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
const copyBtn = () => h('button', { type: 'button', class: 'btn btn-ghost btn-sm', 'data-copy': true }, t('copy'));
const mailRow = () => h('div', { class: 'mail' }, h('span', { class: 'email-text' }, D.person.email), copyBtn());

/* ---------- data prepared once ---------- */
const TYPES = ['ij', 'ic', 'dj', 'dc', 'book', 'wip'];
const ORDER = { ij: 0, ic: 1, dj: 2, dc: 3, book: 4, wip: 5 };
const pubs = D.publications.map((p, i) => Object.assign({}, p, {
  i, hay: [p.title, p.authors.map(a => a.n).join(' '), p.venue, p.details, p.year].join(' ').toLowerCase()
}));
const published = pubs.filter(p => p.type !== 'wip');
const countType = ty => pubs.filter(p => p.type === ty).length;
const byDate = (a, b) => b.year - a.year || b.month - a.month || ORDER[a.type] - ORDER[b.type] || a.i - b.i;
const topics = D.topics.map(tp => Object.assign({}, tp, { re: tp.match.map(m => new RegExp(m, 'i')) }));
const inTopic = (p, tp) => tp.re.some(r => r.test(p.title));
topics.forEach(tp => { tp.count = pubs.filter(p => inTopic(p, tp)).length; });
const YEARS = [];
for (let y = Math.min(...published.map(p => p.year)); y <= Math.max(...published.map(p => p.year)); y++) YEARS.push(y);
const isOn = p => p.end >= todayIso;

/* ---------- views ---------- */
const VIEWS = ['home', 'research', 'members', 'publications', 'projects', 'patents', 'teaching', 'join'];
const ALIAS = { about: 'members', lab: 'members' };
const currentView = () => { let v = location.hash.replace(/^#/, ''); v = ALIAS[v] || v; return VIEWS.includes(v) ? v : 'home'; };
function showView(move) {
  const v = currentView();
  $$('.view').forEach(s => { s.hidden = s.dataset.view !== v; });
  $$('#nav a').forEach(a => {
    if (a.dataset.view === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  if (!move) return;
  const link = $('#nav a[aria-current="page"]'), nav = $('#nav');
  if (link && nav.scrollWidth > nav.clientWidth) {
    const lr = link.getBoundingClientRect(), nr = nav.getBoundingClientRect();
    nav.scrollLeft += lr.left - nr.left - (nr.width - lr.width) / 2;
  }
  window.scrollTo(0, 0);
  const head = $('#view-' + v + ' h1[tabindex]');
  if (head) head.focus({ preventScroll: true });
}
function go(view, patch) {
  if (patch) {
    Object.assign(state, { type: 'all', year: null, topic: null, q: '' }, patch);
    $('#pub-q').value = state.q;
    updatePubs();
  }
  if (currentView() === view) showView(true); else location.hash = view;
}
window.addEventListener('hashchange', () => showView(true));

  p.authors.forEach((a, i) => {
    if (i) out.append(', ');
    out.append(a.me ? h('b', null, a.n) : a.n);
    if (a.c) out.append(h('sup', { class: 'corr', title: t('corr') }, '*', h('span', { class: 'sr-only' }, ' (' + t('corr') + ')')));
  });
  return out;
}
const venueNode = p => h('p', { class: 'venue' }, h('span', null, p.venue), p.details ? ', ' + p.details : '');
function pubTags(p) {
  const tags = [h('span', { class: 'tag' + (p.type === 'wip' ? ' warn' : '') }, t('type.' + p.type))];
  (p.index || []).forEach(x => tags.push(h('span', { class: 'tag idx' }, x)));
  // JCR category rank of the journal (top x%), the one filled green badge in a paper's row
  if (p.jcr) {
    // the tooltip names the JCR year and category when the data has them, otherwise a general sentence
    const tip = p.jcr.note ? L(p.jcr.note) : t('jcr.title', { p: p.jcr.top });
    tags.push(h('span', { class: 'tag rank', title: tip }, t('jcr.top', { p: p.jcr.top })));
  }
  if (p.status === 'forthcoming') tags.push(h('span', { class: 'tag warn' }, t('status.forthcoming')));

}

/* ---------- publications ---------- */
function filtered(ignoreYear) {
  const tokens = state.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const tp = state.topic && topics.find(x => x.id === state.topic);
  return pubs.filter(p =>
    (state.type === 'all' || p.type === state.type) &&
    (ignoreYear || state.year == null || (p.type !== 'wip' && p.year === state.year)) &&
    (!tp || inTopic(p, tp)) &&
    tokens.every(k => p.hay.includes(k)));
}

function renderChart() {
  const fig = $('#pub-chart');
  const typed = state.type !== 'all' && state.type !== 'wip';
  const head = h('div', { class: 'card-head', style: 'margin:1.5rem 0 0' },
    h('h3', null, t('fig2.title') + (typed ? ' · ' + t('type.' + state.type) : '')),
    h('span', { class: 'chart-hint' }, t('fig2.hint')));
  if (state.type === 'wip') { fill(fig, head, h('p', { class: 'note-line' }, t('fig2.none'))); return; }
  const base = filtered(true).filter(p => p.type !== 'wip');
  const by = new Map(YEARS.map(y => [y, []]));
  base.forEach(p => by.get(p.year).push(p));
  const max = Math.max(0, ...YEARS.map(y => by.get(y).length));
  const top = max <= 4 ? 4 : max <= 6 ? 6 : max <= 8 ? 8 : max <= 10 ? 10 : Math.ceil(max / 4) * 4;
  const plot = h('div', { class: 'plot' });
  [top, top / 2].forEach(v => plot.append(h('div', { class: 'gl', style: 'bottom:' + (v / top * 100) + '%' }, h('span', null, v))));
  const tip = h('div', { class: 'tip', hidden: true });
  const showTip = (col, y) => {
    const items = by.get(y);
    const lines = TYPES.filter(ty => ty !== 'wip').map(ty => [ty, items.filter(p => p.type === ty).length]).filter(x => x[1]);
    fill(tip, h('b', null, y + ' · ' + t('n.papers', { n: items.length })), lines.map(x => h('div', null, t('type.' + x[0]) + ' ' + x[1])));
    tip.hidden = false;
    const half = tip.offsetWidth / 2, c = col.offsetLeft + col.offsetWidth / 2;
    tip.style.left = Math.max(half, Math.min(plot.clientWidth - half, c)) + 'px';
    tip.style.top = (plot.clientHeight * (1 - items.length / top)) + 'px';
  };
  const cols = h('div', { class: 'cols' }, YEARS.map(y => {
    const n = by.get(y).length, pct = n / top * 100;
    const col = h('button', {
      type: 'button', class: 'col' + (state.year != null && state.year !== y ? ' dim' : ''),
      'aria-pressed': String(state.year === y), 'aria-label': y + ': ' + t('n.papers', { n }), disabled: n === 0,
      onclick: () => { state.year = state.year === y ? null : y; updatePubs(); },
      onmouseenter: () => showTip(col, y), onfocus: () => showTip(col, y),
      onmouseleave: () => { tip.hidden = true; }, onblur: () => { tip.hidden = true; }
    }, h('span', { class: 'cbar', style: 'height:' + pct + '%' }));
    if (n && (n === max || state.year === y)) col.append(h('span', { class: 'val', style: 'bottom:calc(' + pct + '% + 5px)' }, n));
    return col;
  }));
  plot.append(cols, tip);
  const axis = h('div', { class: 'xaxis', 'aria-hidden': 'true' }, YEARS.map(y => h('span', { class: state.year === y ? 'on' : null },
    h('span', { class: 'y4' }, y), h('span', { class: 'y2' }, String(y).slice(2)))));
  fill(fig, head, plot, axis);
}

function renderPubList() {
  const list = filtered(false);
  const tp = state.topic && topics.find(x => x.id === state.topic);
  const active = state.type !== 'all' || state.year != null || tp || state.q.trim();
  const token = (label, clear) => h('span', { class: 'token' }, label,
    h('button', { type: 'button', 'aria-label': t('remove') + ': ' + label, onclick: () => { clear(); updatePubs(); } }, '×'));
  fill($('#pub-summary'),
    h('span', null, active ? t('sum.some', { n: list.length, total: pubs.length }) : t('sum.all', { total: pubs.length })),
    tp ? token(t('tok.topic', { v: L(tp.title) }), () => { state.topic = null; }) : null,
    state.year != null ? token(t('tok.year', { v: state.year }), () => { state.year = null; }) : null,
    state.q.trim() ? token(t('tok.q', { v: state.q.trim() }), () => { state.q = ''; $('#pub-q').value = ''; }) : null,
    active ? h('button', { type: 'button', class: 'link-btn', onclick: () => {
      Object.assign(state, { type: 'all', year: null, topic: null, q: '' }); $('#pub-q').value = ''; updatePubs();
    } }, t('sum.reset')) : null);

  const groups = [];
  const wip = list.filter(p => p.type === 'wip');
  if (wip.length) groups.push([t('type.wip'), wip]);
  list.filter(p => p.type !== 'wip').sort(byDate).forEach(p => {
    const last = groups[groups.length - 1];
    if (last && last[0] === p.year) last[1].push(p); else groups.push([p.year, [p]]);
  });
  if (!groups.length) { fill($('#pub-list'), h('p', { class: 'empty' }, t('pub.empty'))); return; }
  fill($('#pub-list'), groups.map(g => h('section', { class: 'ygroup' },
    h('h2', null, g[0], h('span', null, t('n.papers', { n: g[1].length }))),
    h('ul', { class: 'card plist' }, g[1].map(p => h('li', { class: 'pub' },
      h('div', null, h('h3', null, p.title), authorsNode(p), venueNode(p)),
      h('div', { class: 'pub-side' }, h('div', { class: 'tags' }, pubTags(p)), p.url ? ext(p.url, p.link) : null)))))));
}

function updatePubs() {
  $$('#pub-filters .fchip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.type === state.type)));
  renderChart();
  renderPubList();
}

/* ---------- projects ---------- */
function renderProjects() {
  const y0 = Math.min(...D.projects.map(p => +p.start.slice(0, 4)));
  const y1 = Math.max(...D.projects.map(p => +p.end.slice(0, 4))) + 1;
  const a = Date.UTC(y0, 0, 1), b = Date.UTC(y1, 0, 1);
  const X = iso => ((Date.parse(iso + 'T00:00:00Z') - a) / (b - a)).toFixed(4);
  const ticks = [y0];
  for (let y = Math.ceil((y0 + 2) / 5) * 5; y <= y1 - 2; y += 5) ticks.push(y);
  ticks.push(y1);
  const on = D.projects.filter(isOn), done = D.projects.filter(p => !isOn(p));
  $('#desc-projects').textContent = t('desc.projects', { on: on.length, done: done.length });
  const row = p => h('li', { class: 'pj-row' },
    h('div', null,
      h('h3', null, state.lang === 'ko' ? p.ko : (p.en || p.ko)),
      h('div', { class: 'pj-meta' },
        h('span', { class: 'period' }, ym(p.start) + ' – ' + ym(p.end)),
        h('span', null, state.lang === 'ko' ? p.sponsor.ko : p.sponsor.en),
        p.pi ? h('span', { class: 'tag line' }, t('pj.pi')) : null,
        isOn(p) ? h('span', { class: 'tag on' }, t('pj.active')) : null)),
    h('div', { class: 'pj-track', 'aria-hidden': 'true' },
      h('div', { class: 'pj-bar' + (p.pi ? ' pi' : ''), style: '--s:' + X(p.start) + ';--e:' + X(p.end) })));
  const inRange = todayIso >= y0 + '-01-01' && todayIso < y1 + '-01-01';
  fill($('#pj'),
    h('div', { class: 'pj-legend' },
      h('b', null, t('fig3.title')),
      h('span', null, h('i', { class: 'pi' }), t('pj.pi')),
      h('span', null, h('i'), t('pj.co')),
      inRange ? h('span', { class: 'only-wide' }, h('i', { class: 'now' }), t('pj.now')) : null),
    h('div', { class: 'pj-list' },
      h('div', { class: 'pj-axis', 'aria-hidden': 'true' }, ticks.map(y => h('span', { style: '--x:' + X(y + '-01-01') }, y))),
      h('div', { class: 'pj-grid', 'aria-hidden': 'true' },
        ticks.map(y => h('i', { style: '--x:' + X(y + '-01-01') })),
        inRange ? h('i', { class: 'now', style: '--x:' + X(todayIso) }) : null),
      on.length ? [h('p', { class: 'pj-group' }, t('pj.active'), h('small', null, t('n.items', { n: on.length }))), h('ul', null, on.map(row))] : null,
      h('p', { class: 'pj-group' }, t('pj.done'), h('small', null, t('n.items', { n: done.length }))),
      h('ul', null, done.map(row))));

/* ---------- language, theme, copy ---------- */
function renderAll() {
  renderChrome(); renderHome(); renderResearch(); renderMembers();
  renderPubStatic(); updatePubs();
  renderProjects(); renderPatents(); renderTeaching(); renderJoin();
  if (figures) figures.refresh();
}
const setLang = lang => { state.lang = lang; store.set('site.lang', lang); renderAll(); };
$('#lang-ko').addEventListener('click', () => setLang('ko'));
$('#lang-en').addEventListener('click', () => setLang('en'));

const savedTheme = store.get('site.theme');
if (savedTheme === 'dark' || savedTheme === 'light') root.dataset.theme = savedTheme;
$('#theme-btn').addEventListener('click', () => {
  const next = isDark() ? 'light' : 'dark';
  root.dataset.theme = next;
  store.set('site.theme', next);
  $('#theme-btn').setAttribute('aria-label', next === 'dark' ? t('theme.light') : t('theme.dark'));
});

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-copy]');
  if (!btn) return;
  const done = label => { btn.textContent = label; setTimeout(() => { btn.textContent = t('copy'); }, 2200); };
  const select = () => {
    const box = btn.closest('.mail'), el = box && box.querySelector('.email-text');
    if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    done(t('copy.fail'));
  };
  try { navigator.clipboard.writeText(D.person.email).then(() => done(t('copied')), select); } catch (err) { select(); }

  reset();
  return {
    still: 7.2,
    restart: reset,
    seek(s) { reset(); at = s; run(); },
    step(dt) { at += dt; run(); },
    draw,
    readout() {
      if (!last) return t('sc4.r.idle');

}

/* ---------- research scene 5: 3D broadcasting with hierarchical modulation ---------- */
// A receiver moves away from a broadcast tower and back, so its SNR falls and recovers. Two lanes
// receive the same dancing stereo pair under the same noise: uniform 16-QAM (both views equally
// protected) and hierarchical 16-QAM (left view on the robust bits, right view on the fragile ones).
// Dots are received symbols; the small cells are the last twelve code blocks of each view, one per
// band of the picture. The arithmetic is real (see hmCore). Drag sideways to move the receiver.
function broadcastScene() {
  const kit = figKit(), { add, scl, nrm, B, bone, LP, LN } = kit;
  const core = hmCore(), { RATE, BPS, BANDS } = core;
  const M = Math.min(1100, kit.N), KDOT = 96, YAW = -0.45, DELTA = 0.1, PITCH = 0.1, YC = 0.97, SC = 10.8, SW = 34, SH = 24, X_NEAR = 20, X_FAR = 86;
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ease = x => (x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x));
  const views = [YAW - DELTA, YAW + DELTA].map(a => [Math.cos(a), Math.sin(a)]), cP = Math.cos(PITCH), sP = Math.sin(PITCH);
  const LIGHT = nrm(add(add(scl([-Math.sin(YAW), 0, Math.cos(YAW)], 0.6), [0, 0.75, 0]), scl([-Math.cos(YAW), 0, -Math.sin(YAW)], 0.45)));
  const RX = [new Float32Array(M), new Float32Array(M)], RY = [new Float32Array(M), new Float32Array(M)], RB = [new Uint8Array(M), new Uint8Array(M)];
  const SHD = new Uint8Array(M), DEP = new Float32Array(M), cloud = figCloud(2 * M, 2);
  const cache = new Map(), state = [{ l: true, r: true }, { l: true, r: true }], ok = [[], [], [], []];
  let at = 0, manual = null, shift = 0, grab = null, fresh = true, snrNow = core.HI;
  const fadeAt = tt => (manual != null ? manual : core.fade(tt + shift)), snrAt = tt => core.snrOf(fadeAt(tt));
  function blk(m) { // the decoding result of block m, computed once
    let r = cache.get(m);
    if (!r) { r = core.block(m, snrAt); cache.set(m, r); if (cache.size > 96) for (const k of cache.keys()) if (k < m - 48) cache.delete(k); }
    return r;
  }
  const name = s => (!s.l ? 'lost' : s.r ? '3d' : '2d');

  function draw(ctx, w, dpr, col) {
    const u = w / 100, px = Math.max(1, dpr), fd = fadeAt(at), xr = (X_NEAR + (X_FAR - X_NEAR) * fd) * u;
    snrNow = core.snrOf(fd);
    // ---- what has been received: the latest finished block of every band, and the debounced picture state

    for (let j = 0; j < BANDS; j++) {

      if (fresh) { s.l = nl >= 6; s.r = nr >= 6; } else { s.l = s.l ? nl > 4 : nl >= 8; s.r = s.r ? nr > 4 : nr >= 8; }
    }
    fresh = false;
    // ---- the programme: one dancer, projected once as a left and a right view (screen units, centred)
    kit.dance(at);
    for (let i = 0; i < M; i++) {
      const o = bone[i] * 12, i3 = i * 3, lx = LP[i3], ly = LP[i3 + 1], lz = LP[i3 + 2], nx = LN[i3], ny = LN[i3 + 1], nz = LN[i3 + 2];
      const x = B[o] + lx * B[o + 3] + ly * B[o + 6] + lz * B[o + 9], y = B[o + 1] + lx * B[o + 4] + ly * B[o + 7] + lz * B[o + 10] - YC, z = B[o + 2] + lx * B[o + 5] + ly * B[o + 8] + lz * B[o + 11];
      SHD[i] = figShade((nx * B[o + 3] + ny * B[o + 6] + nz * B[o + 9]) * LIGHT[0] + (nx * B[o + 4] + ny * B[o + 7] + nz * B[o + 10]) * LIGHT[1] + (nx * B[o + 5] + ny * B[o + 8] + nz * B[o + 11]) * LIGHT[2]);
      for (let v = 0; v < 2; v++) {
        const c = views[v][0], s = views[v][1], x1 = x * c + z * s, z1 = -x * s + z * c, ry = -(y * cP - z1 * sP) * SC;
        RX[v][i] = x1 * SC + (v ? 0.75 : -0.75); RY[v][i] = ry;

        if (!v) DEP[i] = (y * sP + z1 * cP + 0.6) / 1.2;

    }
    // ---- reception: the tower, the ground, the receiver
    const gy = 9.4 * u, tx = 8 * u, ty = 4.4 * u;
    ctx.strokeStyle = col.rule; ctx.lineWidth = px; ctx.beginPath(); ctx.moveTo(4 * u, gy); ctx.lineTo(96 * u, gy); ctx.stroke();
    ctx.strokeStyle = col.mark; ctx.lineWidth = 1.25 * px;
    for (let k = 0; k < 3; k++) { const f = (at * 0.7 + k / 3) % 1; ctx.globalAlpha = 0.6 * (1 - f); ctx.beginPath(); ctx.arc(tx, ty, (1.6 + 5.2 * f) * u, -0.62, 0.62); ctx.stroke(); }
    ctx.globalAlpha = 1; ctx.strokeStyle = col.ink2; ctx.lineWidth = 1.5 * px; ctx.beginPath();
    ctx.moveTo(tx - 1.5 * u, gy); ctx.lineTo(tx, ty); ctx.lineTo(tx + 1.5 * u, gy); ctx.moveTo(tx - 0.8 * u, 7.1 * u); ctx.lineTo(tx + 0.8 * u, 7.1 * u); ctx.stroke();
    ctx.fillStyle = col.ink2; ctx.beginPath(); ctx.arc(tx, ty, 0.6 * u, 0, 6.2832); ctx.fill();
    figText(ctx, dpr, col, t('sc5.tower'), tx, 12.3 * u, { s: 10.5, c: col.ink3, a: 'center' });
    ctx.strokeStyle = col.ink3; ctx.lineWidth = 1.25 * px; ctx.beginPath();
    for (const d of [-1, 1]) { const ax = xr + d * 3.3 * u, ay = gy - 1.25 * u; ctx.moveTo(ax - d * 0.7 * u, ay - 0.8 * u); ctx.lineTo(ax, ay); ctx.lineTo(ax - d * 0.7 * u, ay + 0.8 * u); }
    ctx.stroke();
    ctx.strokeStyle = col.ink2; ctx.lineWidth = 1.5 * px; ctx.beginPath(); ctx.moveTo(xr - 0.5 * u, gy - 2.5 * u); ctx.lineTo(xr - 1.5 * u, gy - 4.2 * u); ctx.stroke();
    ctx.fillStyle = col.card; figRound(ctx, xr - 1.7 * u, gy - 2.5 * u, 3.4 * u, 2.5 * u, 0.5 * u); ctx.fill(); ctx.stroke();
    figText(ctx, dpr, col, t('sc5.recv'), Math.max(xr, 17.5 * u), 12.3 * u, { s: 10.5, c: col.ink3, a: 'center' });
    figText(ctx, dpr, col, t('sc5.snr', { s: snrNow.toFixed(1) }), 94 * u, 3.4 * u, { s: 11, b: 1, c: col.ink, a: 'right' });

    // ---- the two lanes
    for (let k = 0; k < 2; k++) {
      const y0 = (k ? 56.5 : 13) * u, yc = y0 + 12.2 * u, hier = k === 1, okL = ok[k * 2], okR = ok[k * 2 + 1];
      figText(ctx, dpr, col, t(hier ? 'sc5.b' : 'sc5.a'), 6 * u, y0 + 4.6 * u, { b: 1, c: col.ink });
      const sub = t(hier ? 'sc5.b.s' : 'sc5.a.s');
      ctx.font = '500 ' + 11 * dpr + 'px ' + col.font;
      figText(ctx, dpr, col, sub, 6 * u, y0 + 8.7 * u, { s: 6 * u + ctx.measureText(sub).width > 95 * u ? 9.5 : 11, c: col.ink3 });
      // the constellation as received
      const bx = 6 * u, bs = 24 * u, ox = bx + bs / 2, oy = yc + bs / 2, sc = bs / 2.9, lv = hier ? core.H : core.U, th = hier ? core.HT : core.UT;
      ctx.fillStyle = col.card; figRound(ctx, bx, yc, bs, bs, 1.2 * u); ctx.fill();
      ctx.save(); figRound(ctx, bx, yc, bs, bs, 1.2 * u); ctx.clip();
      if (hier) { ctx.fillStyle = col.soft; ctx.globalAlpha = 0.75; ctx.fillRect(ox, yc, bs / 2, bs / 2); ctx.fillRect(bx, oy, bs / 2, bs / 2); ctx.globalAlpha = 1; }
      ctx.strokeStyle = col.rule; ctx.lineWidth = px; if (hier) ctx.setLineDash([2 * px, 3 * px]);
      ctx.beginPath(); for (const d of [-th, th]) { ctx.moveTo(ox + d * sc, yc); ctx.lineTo(ox + d * sc, yc + bs); ctx.moveTo(bx, oy + d * sc); ctx.lineTo(bx + bs, oy + d * sc); } ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = hier ? col.ink3 : col.rule; ctx.lineWidth = (hier ? 1.25 : 1) * px;
      ctx.beginPath(); ctx.moveTo(ox, yc); ctx.lineTo(ox, yc + bs); ctx.moveTo(bx, oy); ctx.lineTo(bx + bs, oy); ctx.stroke();
      ctx.fillStyle = col.ink3; ctx.globalAlpha = 0.5;
      for (const a of lv) for (const b of lv) ctx.fillRect(ox + a * sc - 0.4 * u, oy - b * sc - 0.4 * u, 0.8 * u, 0.8 * u);
      ctx.fillStyle = col.ink2;
      const kn = Math.floor(at * RATE), ds = 1.7 * dpr;
      for (let i = 0; i < KDOT; i++) {
        const q = kn - 1 - i; if (q < 0) break;
        const s = core.sym(q, snrAt(q / RATE)), X = ox + (hier ? s.hI : s.uI) * sc, Y = oy - (hier ? s.hQ : s.uQ) * sc;
        ctx.globalAlpha = 0.12 + 0.78 * (1 - i / KDOT); ctx.fillRect(X - ds / 2, Y - ds / 2, ds, ds);
      }
      ctx.restore(); ctx.globalAlpha = 1;
      ctx.strokeStyle = col.ink3; ctx.lineWidth = px; figRound(ctx, bx, yc, bs, bs, 1.2 * u); ctx.stroke();
      figText(ctx, dpr, col, t('sc5.rx'), ox, yc + bs + 2.7 * u, { s: 10.5, c: col.ink3, a: 'center' });
      // the last twelve blocks of each view
      const rx0 = 34 * u, cw = 1.8 * u;
      for (let v = 0; v < 2; v++) {
        const arr = v ? okR : okL, ly = yc + (v ? 15.2 : 4.2) * u, cyy = ly + 2.4 * u;
        figText(ctx, dpr, col, t(v ? 'sc5.right' : 'sc5.left'), rx0, ly, { s: 10.5, b: 1, c: col.ink2 });
        for (let j = 0; j < BANDS; j++) {
          ctx.globalAlpha = arr[j] ? (v ? 1 : 0.8) : 0.16; ctx.fillStyle = arr[j] ? (v ? col.mark : col.ink2) : col.ink3;
          ctx.fillRect(rx0 + j * cw + 0.5 * px, cyy, cw - px, 2.7 * u);
        }
        if (mc > 0 && frac < 0.7) { ctx.globalAlpha = 0.8 * (1 - frac / 0.7); ctx.strokeStyle = col.ink2; ctx.lineWidth = px; ctx.strokeRect(rx0 + jn * cw - 0.5 * px, cyy - 1.5 * px, cw + px, 2.7 * u + 3 * px); }
        ctx.globalAlpha = 1;
      }

      const sx = 60 * u, sw = SW * u, sh = SH * u, cx = sx + sw / 2, cy = yc + sh / 2, bh = sh / BANDS, s = state[k], nm = name(s);
      ctx.strokeStyle = col.ink3; ctx.lineWidth = 1.25 * px; ctx.beginPath(); ctx.moveTo(cx, yc + sh); ctx.lineTo(cx, yc + sh + 1.5 * u); ctx.moveTo(cx - 4 * u, yc + sh + 1.5 * u); ctx.lineTo(cx + 4 * u, yc + sh + 1.5 * u); ctx.stroke();
      ctx.fillStyle = col.card; figRound(ctx, sx, yc, sw, sh, 1.4 * u); ctx.fill();
      ctx.save(); figRound(ctx, sx, yc, sw, sh, 1.4 * u); ctx.clip();
      ctx.fillStyle = col.ink3; ctx.globalAlpha = 0.14;
      for (let j = 0; j < BANDS; j++) if (!okL[j]) ctx.fillRect(sx, yc + j * bh, sw, bh);
      ctx.globalAlpha = 1;
      cloud.reset();
      for (let i = 0; i < M; i++) {
        if (okL[RB[0][i]]) cloud.add(cx + RX[0][i] * u, cy + RY[0][i] * u, DEP[i], 0, SHD[i]);
        if (okR[RB[1][i]]) cloud.add(cx + RX[1][i] * u, cy + RY[1][i] * u, DEP[i], 1, SHD[i]);
      }
      cloud.paint(ctx, dpr, [col.grey, col.green], [1.45, 1.45], [0.95, 0.82]);
      ctx.restore();
      ctx.strokeStyle = col.ink2; ctx.lineWidth = 1.5 * px; figRound(ctx, sx, yc, sw, sh, 1.4 * u); ctx.stroke();
      const label = t('sc5.' + nm);
      ctx.font = '700 ' + 10.5 * dpr + 'px ' + col.font;
      const tw = ctx.measureText(label).width + 2.2 * u, tb = 3.7 * u, tx0 = sx + 1.3 * u, ty0 = yc + 1.3 * u;
      ctx.fillStyle = nm === '3d' ? col.mark : nm === '2d' ? col.card : col.ink; figRound(ctx, tx0, ty0, tw, tb, 1 * u); ctx.fill();
      ctx.strokeStyle = nm === '3d' ? col.mark : col.ink; ctx.lineWidth = px; ctx.stroke();
      figText(ctx, dpr, col, label, tx0 + tw / 2, ty0 + tb / 2 + 0.1 * u, { s: 10.5, b: 1, a: 'center', c: nm === '3d' ? '#fff' : nm === '2d' ? col.ink : col.card });
    }
  }
  function reset(s) { at = s; manual = null; shift = 0; grab = null; fresh = true; cache.clear(); }
  return {
    still: 8.6,
    restart() { reset(0); },
    seek(s) { reset(s); },
    step(dt) { at += dt; },
    draw,
    readout: () => t('sc5.r', { s: snrNow.toFixed(1), a: t('sc5.' + name(state[0])), b: t('sc5.' + name(state[1])) }),
    // drag sideways: carry the receiver away from the tower or back
    down(e) { manual = fadeAt(at); grab = { x: e.clientX, w: e.target.getBoundingClientRect().width || 1 }; e.target.style.cursor = 'grabbing'; },
    move(e) {

    },
    up(e) { // let go: the receiver heads back toward the tower from where it was left

}

/* ---------- research figures: each theme's scenes beside its text ---------- */
// A theme row owns one figure box; a box with several scenes gets small buttons to switch.
// Scenes are built the first time their box scrolls into view, and only the shown one animates.
const SCENES = {
  1: { key: 'fig1', tab: 'sc1.tab', make: (c, r) => Figure(c, r) },
  2: { key: 'sc2', tab: 'sc2.tab', make: (c, r) => Scene(c, r, handshakeScene) },
  3: { key: 'sc3', tab: 'sc3.tab', make: (c, r) => Scene(c, r, codingScene) },
  4: { key: 'sc4', tab: 'sc4.tab', make: (c, r) => Scene(c, r, programmableScene) },
  5: { key: 'sc5', tab: 'sc5.tab', make: (c, r) => Scene(c, r, broadcastScene) }
};
const TOPIC_SCENES = { volumetric: [1, 4], haptics: [2], networking: [3], broadcast: [5] };
function figureBox(ids, prefix) {
  const cans = ids.map((id, k) => h('canvas', { id: prefix + id, 'aria-hidden': 'true', hidden: k > 0 }));
  const outs = ids.map((id, k) => h('span', { id: prefix + id + '-readout', hidden: k > 0 }));
  const tabs = ids.length > 1 ? ids.map(() => h('button', { type: 'button', 'aria-pressed': 'false' })) : [];
  const title = h('span'), desc = h('span', { class: 'sr-only' });
  const tabRow = tabs.length ? h('div', { class: 'scene-tabs', role: 'group' }, tabs) : null;
  const box = h('figure', { class: 'stage rfig' }, cans,
    h('figcaption', null, tabRow, h('span', { class: 'pill' }, h('i'), title), h('span', { class: 'pill quiet' }, outs), desc));
  const apis = {};
  let ix = 0, seen = false;
  function text() {
    const s = SCENES[ids[ix]];
    title.textContent = t(s.key + '.title'); desc.textContent = t(s.key + '.desc');
    tabs.forEach((b, k) => { b.textContent = t(SCENES[ids[k]].tab); });
    if (tabRow) tabRow.setAttribute('aria-label', t('sc.tabs'));
  }
  function show(k) {
    ix = k;
    cans.forEach((c, j) => { c.hidden = j !== k; }); outs.forEach((o, j) => { o.hidden = j !== k; });
    tabs.forEach((b, j) => b.setAttribute('aria-pressed', String(j === k)));
    text();
    if (!seen) return;
    const id = ids[k];
    if (!apis[id]) apis[id] = SCENES[id].make(cans[k], outs[k]);
    else if (apis[id].show) apis[id].show();
  }
  tabs.forEach((b, k) => b.addEventListener('click', () => { if (k !== ix) show(k); }));
  const wake = () => { if (!seen) { seen = true; show(ix); } };
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { io.disconnect(); wake(); } }, { rootMargin: '400px 0px' });
    io.observe(box);
  } else wake();
  show(0);
  return { el: box, refresh() { text(); Object.values(apis).forEach(a => a.refresh()); }, apis, show, wake };
}
function Figures() {
  // one set for the research view, one for the home page; only the set on screen runs
  const boxes = {}, home = {};
  for (const [topic, ids] of Object.entries(TOPIC_SCENES)) { boxes[topic] = figureBox(ids, 'fig'); home[topic] = figureBox(ids, 'hfig'); }
  // Canvas text does not fetch web-font subsets by itself: ask for the ones the scenes write with, then redraw.
  const refresh = () => [...Object.values(boxes), ...Object.values(home)].forEach(b => b.refresh());
  if (document.fonts && document.fonts.load) {
    const sample = Object.keys(T.ko).filter(k => /^(fig1|sc)/.test(k)).map(k => T.ko[k] + T.en[k]).join('');
    const faces = ['500', '600', '700'].flatMap(wt => ['Inter', '"Noto Sans KR"'].map(fam => document.fonts.load(wt + ' 12px ' + fam, sample)));
    Promise.all(faces).then(refresh, () => {});
  }
  return { boxes, home, refresh };
}

let figures = null;
figures = Figures();
renderAll();
showView(false);
})();
